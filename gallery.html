<!DOCTYPE html>
<html lang="id" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Lane · ChronosLove</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <nav class="navbar">
    <strong style="color:var(--accent);">💖 ChronosLove</strong>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a><a href="vault.html">Pesan</a><a href="gallery.html" class="active">Galeri</a><a href="capsule.html">Kapsul</a><a href="games.html">Games</a>
    </div>
    <div class="theme-switcher">
      <button class="theme-btn" data-theme="midnight"></button><button class="theme-btn" data-theme="sunset"></button><button class="theme-btn" data-theme="cyberpunk"></button><button class="theme-btn" data-theme="minimal"></button>
    </div>
  </nav>

  <main class="container">
    <h1>📸 Memory Lane</h1>
    <p style="color:var(--muted);margin-top:0.5rem;">Setiap foto menyimpan cerita. Klik untuk melihat lebih dekat.</p>
    <div id="gallery" class="masonry"></div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="m-title"></h2>
      <div id="m-img" style="margin:1rem 0;border-radius:12px;overflow:hidden;"></div>
      <p style="color:var(--muted);line-height:1.7;" id="m-caption"></p>
      <div class="modal-actions"><button class="btn" id="m-close" style="background:var(--bg-2);color:var(--text);">Tutup</button></div>
    </div>
  </div>

  <div class="music-player">
    <div class="music-title" id="music-title">🎵 Memuat...</div>
    <div class="visualizer" id="visualizer"></div>
    <div class="music-controls"><button id="play-btn">▶</button></div>
  </div>
  <audio id="bg-audio" preload="auto" loop></audio>

  <script type="module">
    import { initParticles, initThemeSwitcher, requireAccess, initMusicPlayer, APP_DATA } from './js/main.js';
    requireAccess(); initParticles(); initThemeSwitcher(); initMusicPlayer();

    const FOTO_FOLDER = 'foto/';
    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');

    // Placeholder jika foto belum ada
    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#131328"/><text x="50%" y="50%" fill="#ff69b4" font-family="sans-serif" font-size="16" text-anchor="middle" dy=".3em">Foto belum ada</text></svg>`
    );

    function renderGallery() {
      gallery.innerHTML = '';
      APP_DATA.memories.forEach(m => {
        const imgUrl = FOTO_FOLDER + m.filename;
        const div = document.createElement('div');
        div.className = 'masonry-item';
        
        const img = document.createElement('img');
        img.src = imgUrl; img.loading = 'lazy'; img.onerror = () => { img.src = PLACEHOLDER; };
        div.appendChild(img);

        const cap = document.createElement('div'); cap.className = 'masonry-caption'; cap.textContent = m.title;
        div.appendChild(cap);

        div.addEventListener('click', () => {
          document.getElementById('m-title').textContent = m.title;
          const bigImg = document.createElement('img'); bigImg.src = imgUrl; bigImg.style.width = '100%'; bigImg.style.display = 'block'; bigImg.onerror = () => { bigImg.src = PLACEHOLDER; };
          const imgContainer = document.getElementById('m-img'); imgContainer.innerHTML = ''; imgContainer.appendChild(bigImg);
          document.getElementById('m-caption').textContent = m.caption;
          modal.classList.add('active');
        });
        gallery.appendChild(div);
      });
    }

    document.getElementById('m-close').addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('active'); });

    renderGallery();
  </script>
</body>
</html>
